[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nmg-game-dev"
dynamic = ["version"]
description = "Blender-first, Unreal-shipped content pipeline for NMG games"
readme = "CLAUDE.md"
requires-python = ">=3.11"
authors = [{ name = "Nunley Media Group" }]
license = { text = "Proprietary" }
dependencies = ["pydantic>=2,<3", "numpy==2.4.6", "pillow==13.0.0"]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-bdd>=7",
  "ruff>=0.4",
  "mypy>=1.10",
]
# Local texture generation (#7). Only the worker process imports mflux; core installs and CI skip it.
texture-ai = [
  "mflux==0.24.0",
  "hf_transfer==0.1.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nmg_game_dev"]

# VERSION is the single source of truth (steering/snippets/project-tech.md § Versioning). Declaring
# the version dynamic keeps it out of every lockfile, and cache-keys rebuilds the editable install
# when VERSION changes, so importlib.metadata reports the new version without a relock.
[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>\\S+)"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "VERSION" }]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Blender add-on registration requires specific class-name conventions
# (NMGGAMEDEV_OT_*, NMGGAMEDEV_PT_*) per steering/structure.md § Naming
# Conventions, and the hyphenated directory name is load-bearing for the
# Extensions-system install path.
"plugins/nmg-game-dev-blender-addon/**/*.py" = ["N801", "N999"]

[tool.mypy]
python_version = "3.11"
strict = true
# tests/blender/ requires the Blender-bundled Python runtime (bpy, addon_utils)
# which cannot be installed in the dev venv — excluded from type-checking.
exclude = ["tests/blender/"]

[[tool.mypy.overrides]]
module = ["_scaffold_contract"]
ignore_missing_imports = true

# mflux and mlx come from the optional texture-ai extra and are imported only by texture/worker.py.
[[tool.mypy.overrides]]
module = ["mflux", "mflux.*", "mlx", "mlx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
bdd_features_base_dir = "tests/bdd/features"

[dependency-groups]
dev = [
    "mcp==1.30.0",
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "pytest-bdd>=8.1.0",
    "ruff>=0.15.11",
]
